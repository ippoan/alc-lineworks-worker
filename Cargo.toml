# LINE WORKS へのテキスト送信の Worker `alc-lineworks` (Refs ohishi-exp/rust-leave-worker#1)。
# 型は ippoan/alc-dtako-worker・ohishi-exp/rust-leave-worker と同じ。
# 直下の package が worker、route の crate は crates/lineworks (同じ workspace・lock は直下の 1 つ)。
#
# 口・検証・復号・JWT・LINE WORKS の呼び方は crates/lineworks に在り、この Worker が持つのは DB への経路 (`src/db.rs`)・
# 外への HTTP を crate の trait に載せる実装 (`src/http.rs`)・workers-rs への載せ方 (`src/lib.rs`) だけ。
[package]
name = "alc-lineworks-worker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[workspace]
members = ["crates/lineworks"]

# alc-core-wasm・alc-worker-db・alc-worker-crypto は ippoan/alc-worker-kit から引く。git 依存・rev 固定で、**3 つとも同じ rev**
# (ippoan/alc-dtako-worker の rev 5a3b749 から alc-worker-crypto を足しただけの rev。alc-core-wasm / alc-worker-db の中身は同じ)。**書くのはここ 1 か所だけ** (worker と crates/lineworks は `workspace = true` で継承する)。
# 出どころが 2 つになると `PgClient` (alc-worker-db) などが別の型になり、コンパイルは通るのに全リクエストが 500 になる。
# rev を上げるときは 3 つを一緒に上げ、Cargo.lock も一緒に更新する。
[workspace.dependencies]
alc-core-wasm = { git = "https://github.com/ippoan/alc-worker-kit", rev = "a256d2a84682d375dc649d3c4e0e2e91d38c17c2" }
alc-worker-crypto = { git = "https://github.com/ippoan/alc-worker-kit", rev = "a256d2a84682d375dc649d3c4e0e2e91d38c17c2" }
alc-worker-db = { git = "https://github.com/ippoan/alc-worker-kit", rev = "a256d2a84682d375dc649d3c4e0e2e91d38c17c2" }

# 使わない依存は入れない
[dependencies]
alc-worker-db = { workspace = true }
axum = { version = "0.8", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
lineworks = { path = "crates/lineworks" }
tokio-postgres = { version = "0.7", default-features = false, features = ["js"] }
tower-service = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
worker = { version = "0.8", features = ["http", "axum", "tokio-postgres"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
